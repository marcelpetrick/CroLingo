include: package:very_good_analysis/analysis_options.10.0.0.yaml

# riverpod_lint is deliberately not enabled. Since its 3.1.0 release it is an
# analyzer plugin rather than a custom_lint plugin, and would be switched on
# here with:
#
#   plugins:
#     riverpod_lint: ^3.1.8
#
# 3.1.8 needs analyzer 13, which Flutter stable does not yet carry, and
# enabling 3.1.0 leaves `dart analyze` running indefinitely. Revisit when a
# Flutter release relaxes the test_api and matcher pins in flutter_test.

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "build/**"

linter:
  rules:
    # Flutter entry points conventionally return void.
    avoid_void_async: true
    discarded_futures: true
    unawaited_futures: true
