name: Release

on:
  workflow_dispatch:

permissions:
  # Required only because the final step atomically creates the tag and release.
  contents: write # zizmor: ignore[excessive-permissions]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Verify, tag, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reclaim hosted runner disk
        run: ./scripts/reclaim_ci_disk.sh

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Configure stable Android signing
        env:
          RELEASE_KEYSTORE: ${{ secrets.CROLINGO_RELEASE_KEYSTORE }}
          RELEASE_KEY_PASSWORD: ${{ secrets.CROLINGO_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "${RELEASE_KEYSTORE}" || -z "${RELEASE_KEY_PASSWORD}" ]]; then
            echo 'Stable Android signing secrets are required.' >&2
            exit 1
          fi
          keystore="${RUNNER_TEMP}/crolingo-release.p12"
          printf '%s' "${RELEASE_KEYSTORE}" | base64 --decode >"${keystore}"
          chmod 0600 "${keystore}"
          {
            printf 'storeFile=%s\n' "${keystore}"
            printf 'storePassword=%s\n' "${RELEASE_KEY_PASSWORD}"
            printf 'keyAlias=crolingo\n'
            printf 'keyPassword=%s\n' "${RELEASE_KEY_PASSWORD}"
          } >android/key.properties

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake espeak-ng libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-3-dev ninja-build pkg-config

      - name: Bootstrap pinned tools
        run: |
          mkdir -p .pipeline-reports
          ./scripts/bootstrap.sh 2>&1 | tee .pipeline-reports/bootstrap.log

      - name: Run complete pipeline
        run: ./localPipeline.sh --noRun --low-disk-builds --report-dir .pipeline-reports

      - name: Upload pipeline reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-pipeline-reports
          path: .pipeline-reports
          if-no-files-found: warn
          include-hidden-files: true

      - name: Read release metadata
        id: metadata
        run: |
          version="$(sed -n 's/^version: \([^+]*\)+[0-9][0-9]*$/\1/p' pubspec.yaml)"
          if [[ ! "${version}" =~ ^0\.[0-9]+\.[0-9]+$ ]]; then
            echo 'pubspec.yaml does not contain a valid pre-1.0 version.' >&2
            exit 1
          fi
          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"

      - name: Verify stable Android signing identity
        run: |
          ./scripts/verify_android_signing.sh \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            android/release-signing-certificate.sha256

      - name: Package verified artifacts
        run: ./scripts/package_release.sh dist

      - name: Write release notes
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          printf 'CroLingo %s\n\n' \
            "${RELEASE_VERSION}" >.release-notes.md
          cat >>.release-notes.md <<'EOF'
          This automated release passed CroLingo's complete quality pipeline.

          For the Huawei Mate 20 and current Poco/Xiaomi phones, download the
          `arm64-v8a.apk`. Android may ask you to allow installation
          from the browser or file manager used to open it.

          APK releases use CroLingo's stable external signing identity. Starting
          with this release, later APKs can upgrade in place and retain local
          learning progress. Builds older than this signing transition must be
          uninstalled once before installing this release.

          Verify downloads with `SHA256SUMS.txt` when possible.
          CycloneDX 1.7 and SPDX 2.3 JSON SBOMs are attached for automated
          dependency, security, and compliance ingestion.
          EOF

      - name: Create tag and published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "CroLingo ${RELEASE_TAG}" \
            --notes-file .release-notes.md \
            --latest
