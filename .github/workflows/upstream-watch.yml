name: Upstream watch

# Two known pieces of work wait on one upstream fact: whether flutter_test
# still pins test_api and matcher low enough to cap the analyzer below 13.
# Checking that by hand at every Flutter release is a chore nobody performs,
# so it runs weekly instead. A red run here is good news: it means the
# blocker lifted. See docs/review20260809.md.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-watch
  cancel-in-progress: true

jobs:
  analyzer-blocker:
    name: Is analyzer 13 reachable yet
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pins from Flutter stable
        run: ./scripts/check_analyzer_unblock.sh
