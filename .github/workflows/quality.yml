name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Local pipeline replica
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reclaim hosted runner disk
        run: ./scripts/reclaim_ci_disk.sh

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake espeak-ng libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-3-dev ninja-build pkg-config

      - name: Bootstrap pinned tools
        run: |
          mkdir -p .pipeline-reports
          ./scripts/bootstrap.sh 2>&1 | tee .pipeline-reports/bootstrap.log

      - name: Run complete pipeline
        run: ./localPipeline.sh --noRun --low-disk-builds --report-dir .pipeline-reports

      - name: Upload pipeline reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipeline-reports
          path: .pipeline-reports
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload verified builds
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-builds
          path: |
            build/linux/x64/release/bundle
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload software bills of materials
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: software-bills-of-materials
          path: |
            build/sbom/CroLingo.cdx.json
            build/sbom/CroLingo.spdx.json
          if-no-files-found: error
